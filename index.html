<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Cat — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070b;--panel:rgba(18,20,29,.82);--line:rgba(255,255,255,.1);--muted:#9299aa;--white:#f7f8fc;--good:#55e6aa;--bad:#ff6475;--a:#8b6cff;--b:#22c9ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05060a;color:var(--white);font-family:Manrope,system-ui,sans-serif}body{display:grid;place-items:center;padding:24px 14px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 25% 15%,#6e4dff2b,transparent 28%),radial-gradient(circle at 80% 10%,#20c9ff1c,transparent 25%),linear-gradient(90deg,#ffffff04 1px,transparent 1px),linear-gradient(#ffffff04 1px,transparent 1px);background-size:auto,auto,36px 36px,36px 36px;mask-image:linear-gradient(#000,transparent 85%);animation:bg 12s ease-in-out infinite alternate}@keyframes bg{to{transform:translate3d(1%,2%,0) scale(1.03)}}
.shell{width:min(460px,100%)}.brand{text-align:center;margin-bottom:18px}.logo{width:78px;height:78px;margin:auto auto 12px;border:1px solid #ffffff18;border-radius:25px;background:linear-gradient(145deg,#8b6cff33,#22c9ff12);display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 25px 70px #0008,inset 0 1px #fff2;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-5px)}}.cat{font-size:34px;filter:drop-shadow(0 8px 12px #0008)}.r{width:25px;height:25px;border-radius:7px;background:#fff;color:#111;display:grid;place-items:center;font-weight:900;font-size:14px;transform:rotate(-8deg)}.eyebrow{font:600 10px "IBM Plex Mono";letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}h1{font-size:27px;letter-spacing:-.04em;margin:7px 0 0}
.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;padding:24px;background:linear-gradient(180deg,#171923e8,#0b0c11f5);backdrop-filter:blur(24px);box-shadow:0 35px 110px #0009,inset 0 1px #fff1;animation:cardIn .35s ease}@keyframes cardIn{from{opacity:.2;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.progress b{font:600 12px "IBM Plex Mono";color:#fff}.bar,.thin{height:6px;background:#20212a;border-radius:99px;overflow:hidden;margin-bottom:16px}.bar i,.thin i{display:block;width:0;height:100%;background:linear-gradient(90deg,#7a5cff,#22c9ff,#fff);box-shadow:0 0 18px #8b6cff88;transition:width .25s}
.captcha{position:relative;border:1px solid #ffffff12;border-radius:16px;overflow:hidden;background:#050506;margin-bottom:14px}.captcha canvas{display:block;width:100%;height:112px}.refresh{position:absolute;right:10px;top:10px;width:36px;height:36px;border:1px solid #ffffff18;border-radius:11px;background:#090a0ecc;color:#fff;cursor:pointer;font-size:18px}
label{display:block;color:var(--muted);font-size:12px;margin:9px 0 7px}input{width:100%;height:51px;border:1px solid #ffffff12;border-radius:14px;background:#090a0e;color:#fff;padding:0 14px;outline:0;font:600 16px "IBM Plex Mono";transition:.2s}input:focus{border-color:#ffffff42;box-shadow:0 0 0 4px #8b6cff12}.wide{text-transform:uppercase;letter-spacing:.25em}
.btn{width:100%;height:52px;border:0;border-radius:15px;margin-top:12px;background:linear-gradient(135deg,#fff,#dfe3ff);color:#101116;font-weight:800;cursor:pointer;box-shadow:0 12px 30px #0005;transition:.18s}.btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px #0007}.btn:active{transform:translateY(1px)}.ghost{background:transparent;color:#ddd;border:1px solid #ffffff18}.msg{text-align:center;min-height:22px;margin-top:12px;color:var(--muted);font-size:12px}.bad{color:var(--bad)}.good{color:var(--good)}.center{text-align:center}.center h2{font-size:24px;margin:5px 0 8px}.center p{color:var(--muted);line-height:1.5;margin:7px 0}.status{font:600 13px "IBM Plex Mono";color:#d7d9e2}
.motion{height:142px;position:relative;margin:8px 0;border-radius:20px;background:linear-gradient(180deg,#ffffff06,transparent);overflow:hidden}.motion:after{content:"";position:absolute;left:8%;right:8%;bottom:25px;height:2px;background:linear-gradient(90deg,transparent,#fff3,transparent)}
.coin{position:absolute;left:12%;bottom:32px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff0ae,#e2b64f 50%,#7b5619);box-shadow:0 0 0 4px #e2b64f1c,0 14px 25px #0007;animation:coin 1.05s linear infinite}.coin:after{content:"R";position:absolute;inset:0;display:grid;place-items:center;color:#fff4bd;font-weight:900;font-size:19px}@keyframes coin{0%{transform:translateX(-5px) rotateY(0)}100%{transform:translateX(215px) rotateY(1080deg)}}
.runner{position:absolute;right:12%;bottom:27px;font-size:45px;filter:drop-shadow(0 10px 9px #0008);animation:run .25s ease-in-out infinite alternate}@keyframes run{to{transform:translateY(-8px) rotate(5deg)}}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.note{font-size:11px!important;color:#73798a!important;margin-top:16px!important}
</style>
</head>
<body><main class="shell"><div class="brand"><div class="logo"><span class="cat">🐱</span><span class="r">R</span></div><div class="eyebrow" id="eyebrow">доступ</div><h1 id="title">Пройди 15 капч подряд</h1></div><section class="card" id="card"></section></main>
<script>
const FALLBACK={CAT:800,MEOW:500,KITTY:1200,ROBLOXCAT:2500},CHARS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",S={nick:"",amount:0};
const card=document.getElementById("card"),title=document.getElementById("title"),ey=document.getElementById("eyebrow");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const code=()=>Array.from({length:6},()=>CHARS[Math.floor(Math.random()*CHARS.length)]).join("");
const draw=(c,v)=>{let x=c.getContext("2d"),w=c.width,h=c.height;x.fillStyle="#050506";x.fillRect(0,0,w,h);for(let i=0;i<90;i++){x.fillStyle="rgba(255,255,255,"+(Math.random()*.1+.03)+")";x.fillRect(Math.random()*w,Math.random()*h,2,2)}for(let i=0;i<7;i++){x.strokeStyle="rgba(220,220,230,.2)";x.beginPath();x.moveTo(Math.random()*w,Math.random()*h);x.lineTo(Math.random()*w,Math.random()*h);x.stroke()}for(let i=0;i<6;i++){x.save();x.translate(w/7*(i+.8),h/2+Math.random()*20-10);x.rotate(Math.random()*.6-.3);x.font="64px 'IBM Plex Mono'";x.fillStyle="#e8e8ef";x.fillText(v[i],0,16);x.restore()}};
function caps(n,reset,done){let p=0,c=code();title.textContent=n===15?"Пройди 15 капч подряд":"100 Robux • проверка";ey.textContent=n===15?"доступ":"антинакрутка";card.innerHTML=`<div class="progress"><span>Прогресс</span><b id="count">0 / ${n}</b></div><div class="bar"><i id="bar"></i></div><div class="captcha"><canvas id="cv" width="800" height="224"></canvas><button class="refresh" id="ref">↻</button></div><label>Введи 6 символов с картинки</label><input id="ans" class="wide" maxlength="6" autocomplete="off"><button class="btn" id="ok">Проверить</button><div class="msg" id="m">${reset?"Одна ошибка — всё сначала.":"Ошибка не сбрасывает прогресс."}</div>`;let cv=document.getElementById("cv"),a=document.getElementById("ans"),m=document.getElementById("m"),bar=document.getElementById("bar"),count=document.getElementById("count"),next=()=>{c=code();draw(cv,c);a.value="";a.focus()};document.getElementById("ref").onclick=next;let check=()=>{if(a.value.toUpperCase()===c){p++;count.textContent=p+" / "+n;bar.style.width=p/n*100+"%";if(p===n)return done();m.textContent="Верно. Продолжаем…";m.className="msg good";next()}else{m.textContent=reset?"Неверно. Начинаем заново.":"Неверно. Попробуй ещё раз.";m.className="msg bad";if(reset)p=0;count.textContent=p+" / "+n;bar.style.width=p/n*100+"%";card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");next()}};document.getElementById("ok").onclick=check;a.onkeydown=e=>e.key==="Enter"&&check();next()}
function nick(){title.textContent="Найди профиль";ey.textContent="шаг 2";card.innerHTML='<label>Ник</label><input id="nick" maxlength="32" placeholder="например, ShadowCat"><button class="btn" id="go">Искать</button><div class="msg">Поиск профиля Roblox Cat</div>';let go=()=>{let n=document.getElementById("nick").value.trim();if(n.length<3)return document.querySelector(".msg").textContent="Слишком короткий ник.";S.nick=n;search()};document.getElementById("go").onclick=go;document.getElementById("nick").onkeydown=e=>e.key==="Enter"&&go()}
function motion(status,seconds,next){title.textContent=status;ey.textContent="обработка";card.innerHTML='<div class="center"><div class="motion"><div class="coin"></div><div class="runner">🐱</div></div><div class="thin"><i id="load"></i></div><div class="status" id="st"></div></div>';let start=Date.now(),total=seconds*1000,t=setInterval(()=>{let p=Math.min(1,(Date.now()-start)/total);document.getElementById("load").style.width=p*100+"%";document.getElementById("st").textContent=seconds+" секунд";if(p>=1){clearInterval(t);next()}},80)}
function search(){motion("Поиск профиля",5,()=>{title.textContent="Профиль найден";ey.textContent="успешно";card.innerHTML='<div class="center"><h2>Успешно!</h2><p>Профиль <b style="color:#fff">'+esc(S.nick)+'</b> найден.</p><button class="btn" id="next">Продолжить</button></div>';document.getElementById("next").onclick=promo})}
function promo(){title.textContent="Roblox Cat";ey.textContent="промокод";card.innerHTML='<label>Введите промокод Roblox Cat</label><input id="p" maxlength="24"><button class="btn" id="go">Проверить</button><div class="msg">Доступны CAT, MEOW, KITTY, ROBLOXCAT</div>';document.getElementById("go").onclick=async()=>{let k=document.getElementById("p").value.trim().toUpperCase().replace(/\s+/g,"");let amount=FALLBACK[k]||null;try{let r=await fetch("/api/promo?code="+encodeURIComponent(k));let d=await r.json();if(d.ok)amount=d.amount}catch{}if(!amount)return document.querySelector(".msg").textContent="Промокод не действителен!";S.amount=amount;title.textContent="Код принят";card.innerHTML='<div class="center"><h2>'+amount+' Robux</h2><p>Промокод найден. Начинаем обработку.</p><button class="btn" id="next">Продолжить</button></div>';document.getElementById("next").onclick=processing}}
function processing(){title.textContent="Вывод Robux";ey.textContent="подожди";card.innerHTML='<div class="center"><div class="motion"><div class="coin"></div><div class="runner">🐱</div></div><div class="thin"><i id="load"></i></div><div class="status" id="st">Вывод Robux... 13 секунд</div><div class="msg">Демо-обработка • реальные Robux не выводятся.</div></div>';let start=Date.now(),t=setInterval(()=>{let p=Math.min(1,(Date.now()-start)/13000);document.getElementById("load").style.width=p*100+"%";let left=Math.max(0,Math.ceil((13000-(Date.now()-start))/1000));document.getElementById("st").textContent=left>0?"Вывод Robux... "+left+" секунд":"Ищем все возможные способы вывода!";if(p>=1){clearInterval(t);setTimeout(()=>caps(100,false,age),700)}},80)}
function age(){title.textContent="Проверка возраста";ey.textContent="аккаунт";card.innerHTML='<div class="center"><div class="status" id="age">9 секунд</div><p>Проверка возраста аккаунта...</p><div class="motion"><div class="coin"></div><div class="runner">🐱</div></div><div class="thin"><i id="agebar"></i></div></div>';let start=Date.now(),t=setInterval(()=>{let p=Math.min(1,(Date.now()-start)/9000),left=Math.max(0,Math.ceil(9-(Date.now()-start)/1000));document.getElementById("age").textContent=left+" секунд";document.getElementById("agebar").style.width=p*100+"%";if(p>=1){clearInterval(t);title.textContent="Ошибка!";ey.textContent="проверка завершена";card.innerHTML='<div class="center"><h2>Ошибка!</h2><p>Аккаунт не соответствует требованиям к возрасту (16+)!</p><p>Вывод остановлен.</p><p class="note">Демо-розыгрыш: реальные Robux не начисляются.</p></div>'}},80)}
caps(15,true,nick);
</script></body></html>
